name: Unit Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: Python Unit Tests (${{ matrix.os }}, onepush ${{ matrix.onepush-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        onepush-version: ['1.2.0', '1.6.0', 'latest']
    steps:
      - name: Check-out repository
        uses: actions/checkout@v6

      # 检查当前 Python 版本
      - name: Check Python
        id: check_python
        shell: bash
        run: |
          # 检查 Python 版本
          PYTHON_VERSION=$(python --version 2>&1 || python3 --version 2>&1)
          echo "Detected Python version: $PYTHON_VERSION"
          
          if echo "$PYTHON_VERSION" | grep -i "python 3\.12"; then
            echo "python_version=3.12" >> $GITHUB_OUTPUT
            echo "skip_setup=true" >> $GITHUB_OUTPUT
          else
            echo "skip_setup=false" >> $GITHUB_OUTPUT
          fi

      # 设置 Python 环境（仅当版本不是 3.12 时）
      - name: Setup Python
        if: steps.check_python.outputs.skip_setup != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pin OnePush Version
        if: matrix.onepush-version != 'latest'
        shell: bash
        run: |
          pip install "onepush==${{ matrix.onepush-version }}" --force-reinstall --no-deps

      # 验证当前安装的 onepush 版本与矩阵一致
      - name: Verify OnePush Version
        shell: bash
        run: |
          # 打印当前 onepush 版本
          python -c "import importlib.metadata as m; print('onepush', m.version('onepush'))"
          # 非 latest 时断言版本一致
          if [ "${{ matrix.onepush-version }}" != "latest" ]; then
            python -c "import importlib.metadata as m; v=m.version('onepush'); assert v == '${{ matrix.onepush-version }}', f'expected ${{ matrix.onepush-version }}, got {v}'"
          fi

      - name: Run Unit Tests
        run: |
          python -m pytest tests/ -v --tb=short --color=yes --junitxml=test-results.xml --durations=10 -p no:cacheprovider

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.onepush-version }}
          path: test-results.xml
          retention-days: 3
